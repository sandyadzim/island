server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro is a multi-page static site with trailingSlash: 'always'
    # -> /portfolio/index.html, /index.html. NO SPA fallback to /index.html,
    # otherwise every wrong URL returns 200 which hurts SEO.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Hashed build output from Astro/Vite (JS, CSS, self-hosted fonts)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Artwork, icons, social preview
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Background music
    location /audio/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Downloadable CV
    location /downloads/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML must revalidate so deploys are picked up immediately
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
