server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Astro multi-page + trailingSlash: 'always' -> /portfolio/index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Hashed build output dari Astro/Vite (JS, CSS, font self-hosted)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Artwork, icons, social preview
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Background music
    location /audio/ {
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Downloadable CV
    location /downloads/ {
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML must revalidate so deploys are picked up immediately
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
