# Header keamanan bersama.
#
# Dipakai lewat `include /etc/nginx/snippets/security-headers.conf` di blok
# `server` DAN di setiap `location` yang punya `add_header` sendiri — karena
# add_header di level location me-reset seluruh add_header warisan dari server.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
